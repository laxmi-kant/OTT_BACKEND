name: Build and Deploy Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      environment:
        required: true
        type: string
      is-deploy:
        required: true
        type: boolean

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  # ──────────────────────────────────────────────
  # CI: Build, Test, Docker Build + Push
  # ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      ecr-repo: ${{ steps.meta.outputs.ecr-repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Download shared libs built by build-shared-libs job
      - name: Download shared libs
        id: download-shared-libs
        uses: actions/download-artifact@v4
        with:
          name: shared-libs-m2
          path: ~/.m2/repository/com/ottnetwork/
        continue-on-error: true

      # Fallback: build shared libs from source if artifact not available
      - name: Build shared libs (fallback)
        if: steps.download-shared-libs.outcome == 'failure'
        run: |
          mvn -f shared-libs/ott-common/pom.xml clean install -DskipTests -B
          mvn -f shared-libs/ott-security/pom.xml clean install -DskipTests -B
          mvn -f shared-libs/ott-kafka/pom.xml clean install -DskipTests -B

      # Build and run tests
      - name: Maven build and test
        run: mvn -f services/${{ inputs.service-name }}/pom.xml clean package -B

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.service-name }}
          path: services/${{ inputs.service-name }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ inputs.environment }}-${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
          ECR_REPO="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ inputs.service-name }}"
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "ecr-repo=$ECR_REPO" >> $GITHUB_OUTPUT

      # --- Docker Build + Push (deploy only) ---

      - name: Configure AWS credentials
        if: inputs.is-deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: inputs.is-deploy
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: inputs.is-deploy
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service-name }}
          push: true
          tags: |
            ${{ steps.meta.outputs.ecr-repo }}:${{ steps.meta.outputs.image-tag }}
            ${{ steps.meta.outputs.ecr-repo }}:${{ inputs.environment }}-latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.ecr-repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.ecr-repo }}:buildcache,mode=max

      # --- Docker Build only (PR / CI only) ---

      - name: Build Docker image (CI only)
        if: ${{ !inputs.is-deploy }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service-name }}
          push: false
          tags: ${{ inputs.service-name }}:ci-test

  # ──────────────────────────────────────────────
  # CD: Deploy to AWS EKS
  # ──────────────────────────────────────────────
  deploy:
    needs: build
    if: inputs.is-deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ott-platform --dry-run=client -o yaml | kubectl apply -f -

      # Fetch all credentials from AWS Secrets Manager
      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "ott-platform/${{ inputs.environment }}/credentials" \
            --region ${{ env.AWS_REGION }} \
            --query 'SecretString' --output text)

          echo "::add-mask::$(echo $SECRET_JSON | jq -r '.DB_PASSWORD')"
          echo "::add-mask::$(echo $SECRET_JSON | jq -r '.JWT_SECRET')"
          echo "::add-mask::$(echo $SECRET_JSON | jq -r '.REDIS_PASSWORD')"

          echo "DB_HOST=$(echo $SECRET_JSON | jq -r '.DB_HOST')" >> $GITHUB_OUTPUT
          echo "DB_USERNAME=$(echo $SECRET_JSON | jq -r '.DB_USERNAME')" >> $GITHUB_OUTPUT
          echo "DB_PASSWORD=$(echo $SECRET_JSON | jq -r '.DB_PASSWORD')" >> $GITHUB_OUTPUT
          echo "REDIS_HOST=$(echo $SECRET_JSON | jq -r '.REDIS_HOST')" >> $GITHUB_OUTPUT
          echo "REDIS_PASSWORD=$(echo $SECRET_JSON | jq -r '.REDIS_PASSWORD')" >> $GITHUB_OUTPUT
          echo "KAFKA_BOOTSTRAP_SERVERS=$(echo $SECRET_JSON | jq -r '.KAFKA_BOOTSTRAP_SERVERS')" >> $GITHUB_OUTPUT
          echo "JWT_SECRET=$(echo $SECRET_JSON | jq -r '.JWT_SECRET')" >> $GITHUB_OUTPUT

      # Apply ConfigMap (non-sensitive infra endpoints)
      - name: Apply ConfigMap
        run: |
          export DB_HOST="${{ steps.secrets.outputs.DB_HOST }}"
          export REDIS_HOST="${{ steps.secrets.outputs.REDIS_HOST }}"
          export KAFKA_BOOTSTRAP_SERVERS="${{ steps.secrets.outputs.KAFKA_BOOTSTRAP_SERVERS }}"
          envsubst < services/${{ inputs.service-name }}/k8s/configmap.yaml | kubectl apply -f -

      # Apply Secrets (sensitive credentials from Secrets Manager)
      - name: Apply Secrets
        run: |
          kubectl create secret generic ${{ inputs.service-name }}-secrets \
            --namespace=ott-platform \
            --from-literal=db-username="${{ steps.secrets.outputs.DB_USERNAME }}" \
            --from-literal=db-password="${{ steps.secrets.outputs.DB_PASSWORD }}" \
            --from-literal=redis-password="${{ steps.secrets.outputs.REDIS_PASSWORD }}" \
            --from-literal=jwt-secret="${{ steps.secrets.outputs.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Apply Deployment with image tag and AWS account substitution
      - name: Apply Deployment
        run: |
          export AWS_ACCOUNT_ID="${{ vars.AWS_ACCOUNT_ID }}"
          export AWS_REGION="${{ env.AWS_REGION }}"
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"

          sed "s|\${AWS_ACCOUNT_ID}|${AWS_ACCOUNT_ID}|g; \
               s|\${AWS_REGION}|${AWS_REGION}|g; \
               s|:latest|:${IMAGE_TAG}|g" \
            services/${{ inputs.service-name }}/k8s/deployment.yaml | kubectl apply -f -

      - name: Apply Service
        run: kubectl apply -f services/${{ inputs.service-name }}/k8s/service.yaml

      - name: Apply HPA
        run: kubectl apply -f services/${{ inputs.service-name }}/k8s/hpa.yaml

      # Wait for rollout
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ inputs.service-name }} \
            --namespace=ott-platform \
            --timeout=300s

      # Verify deployment health
      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ott-platform -l app=${{ inputs.service-name }} -o wide

          echo "=== Rollout History ==="
          kubectl rollout history deployment/${{ inputs.service-name }} -n ott-platform

          # Check at least 1 pod is Ready
          READY_PODS=$(kubectl get pods -n ott-platform -l app=${{ inputs.service-name }} \
            -o jsonpath='{.items[*].status.containerStatuses[0].ready}' | tr ' ' '\n' | grep -c true || echo 0)

          if [ "$READY_PODS" -lt 1 ]; then
            echo "ERROR: No ready pods. Initiating auto-rollback..."
            kubectl rollout undo deployment/${{ inputs.service-name }} -n ott-platform
            exit 1
          fi
          echo "Deployment verified: $READY_PODS pod(s) ready."

      # Annotate deployment for traceability
      - name: Annotate deployment
        if: success()
        run: |
          kubectl annotate deployment/${{ inputs.service-name }} \
            -n ott-platform --overwrite \
            ott.network/deployed-by="${{ github.actor }}" \
            ott.network/commit-sha="${{ github.sha }}" \
            ott.network/image-tag="${{ needs.build.outputs.image-tag }}" \
            ott.network/workflow-run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
